<!--Recibe la variable vacunas,paciente-->
{% extends 'clinica/base_expediente.html' %}
{% block content %}
<h3>Historial de Vacunación</h3>
<ul>
    {% for vac in vacunas %}
        <li>{{ vac.get_nombre_display }} - {{ vac.dosis }} - {{ vac.fecha_aplicacion|date:"d/m/Y" }}</li> <!--Vacunas no tiene hora-->
    {% empty %}
        <li>No hay vacunas registradas.</li>
    {% endfor %}
</ul>
{% endblock %}
