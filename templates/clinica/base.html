{% load static %} <!--Carga de archivos estaticos (css)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} {% endblock %}</title>

   <!--Estilos CSS.--> 
   <link rel="stylesheet" href="{% static 'css/estilos.css' %}">

    <!-- Font Awesome oficial (versión 6.5.1 estable) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
    <header>

        <!--Informacion-->
        <div class="base_contenedor_header">

                <div class="base_info">
                    <h1>Panel del doctor</h1>
                    <p>Dr. {{user.get_full_name}}</p>
                </div>
            
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="base_logout">
                <i class="fa-solid fa-arrow-right-from-bracket fa-lg"></i> Cerrar sesión
                </button>
            </form>
            
            
        </div>


       <!--Menus(se coloca la clase activo dependiendo del menu donde este)--> 
       <!-- request.resolver_match.url_name da el nombre de la vista actual. -->


        <nav class="base_flex_nav">
            <a href="{% url 'lista_pacientes' %}" class="{% if request.resolver_match.url_name == 'lista_pacientes' %}activo{% endif %}">
                <i class="fa-regular fa-user fa-lg"></i> 
                Pacientes
            </a>

            <a href="{% url 'expediente_buscar' %}" class="{% if request.resolver_match.url_name == 'expediente_buscar' %}activo{% endif %}">
            <i class="fa-regular fa-file-lines fa-lg"></i> 
            Expediente
    </a>
</nav>
    </header>

    {% block content %}{% endblock %}

</body>
</html>
