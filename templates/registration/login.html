{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Expediente Clínico</title>
    
     <!-- Font Awesome oficial (versión 6.5.1 estable) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">

</head>
<body class="login_body">

    <div class="login_container">
        <div class="login_icon_circle">
            <i class="fa-solid fa-stethoscope"></i>
        </div>

        <h2 class="login_title">Sistema de Expediente Clínico</h2>
        <p class="login_subtitle">Ingresa tus credenciales</p>

        <form method="post" class="login_form">
            {% csrf_token %}
            
            <div class="login_field_group">
                <label class="login_label">Nombre de Usuario</label>
                <div class="login_input_wrapper">
                    {{ form.username }}
                </div>
            </div>

            <div class="login_field_group">
                <label class="login_label">Contraseña</label>
                <div class="login_input_wrapper">
                    {{ form.password }}
                </div>
            </div>

            {% if form.errors or messages %}
                <div class="login_error_message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <div class="login_button_group">
                <button type="submit" class="login_btn_primary">Iniciar Sesión</button>
            </div>

        </form>
    </div>

</body>
</html>
